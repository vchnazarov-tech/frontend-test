<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vc.ru Card Template</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #edeef0;
    font-family: 'Roboto', sans-serif;
    display: flex;
    justify-content: center;
    padding: 84px 16px 24px;
  }

  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 10;
    width: 100%;
    height: 60px;
    background: #FFE5EA;
    display: flex;
    align-items: center;
    padding: 0 24px;
  }

  .site-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    color: #000;
  }

  .site-logo svg path {
    fill: currentColor;
  }

  .reaction-pack-switcher {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .reaction-pack-link {
    padding: 6px 10px;
    color: #595959;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    line-height: 20px;
    text-decoration: none;
  }

  .reaction-pack-link:hover { background: rgba(0, 0, 0, 0.06); }

  .reaction-pack-link.is-active {
    color: #000;
    background: #fff;
  }

  .reaction-pack-link:focus-visible {
    outline: 3px solid #418AF4;
    outline-offset: 1px;
  }

  .view-switcher,
  .theme-switcher {
    position: fixed;
    left: 16px;
    z-index: 9;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 4px;
    background: #fff;
    border: 1px solid rgba(0,0,0,0.10);
    border-radius: 10px;
  }

  .view-switcher { top: 84px; }
  .theme-switcher { top: 170px; }

  .view-switch,
  .theme-switch {
    width: 92px;
    height: 34px;
    padding: 0 10px;
    color: #595959;
    background: transparent;
    border: 0;
    border-radius: 7px;
    font-family: 'Roboto', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }

  .view-switch:hover,
  .theme-switch:hover {
    background: #F4F4F4;
  }

  .view-switch.is-active,
  .theme-switch.is-active {
    color: #fff;
    background: #0B5DD7;
  }

  .view-switch:focus-visible,
  .theme-switch:focus-visible {
    outline: 3px solid #418AF4;
    outline-offset: 1px;
  }

  [hidden] {
    display: none !important;
  }

  /* Карточка */
  .post-card {
    width: 640px;
    max-width: 100%;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
  }

  .post-inner {
    padding: 0 24px;
  }

  /* Шапка */
  .post-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0 12px;
  }

  .author-block {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Аватар с градиентом */
  .avatar-wrap {
    position: relative;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
  }

  .avatar-main {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: conic-gradient(
      from 90deg,
      #6ed0ff 0deg,
      #61a1ff 42deg,
      #9d70ff 89deg,
      #ff60c7 137deg,
      #ff483e 180deg,
      #ff9400 223deg,
      #ffde48 270deg,
      #7ae632 306deg,
      #6fd1ff 359deg,
      #6ed0ff 360deg
    );
    outline: 1px solid rgba(0,0,0,0.10);
    outline-offset: -1px;
  }

  /* vc.ru-бейдж */
  .avatar-badge {
    position: absolute;
    bottom: -2px;
    right: -4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #1693E5;
    border: 2px solid #fff;
  }

  .author-info {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .author-name-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .author-name {
    font-size: 15px;
    font-weight: 500;
    color: #000;
    line-height: 22px;
  }

  .author-name-badge {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .author-name-badge-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .reaction-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  .reaction-icon-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .reaction-webp-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }


  .author-meta {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .author-section {
    font-size: 13px;
    font-weight: 400;
    color: #000;
    line-height: 18px;
  }

  .author-time {
    font-size: 13px;
    color: #595959;
    line-height: 18px;
  }

  /* Кнопки справа */
  .header-actions {
    display: flex;
    align-items: center;
  }

  .btn-subscribe {
    font-family: 'Roboto', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #000;
    background: #F4F4F4;
    border: none;
    border-radius: 8px;
    padding: 5px 10px;
    height: 28px;
    cursor: pointer;
    line-height: 18px;
  }
  .btn-subscribe:hover { background: #e8e8e8; }

  .btn-more {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 50%;
    padding: 9px 8px;
  }
  .btn-more:hover { background: #f4f4f4; }

  /* Заголовок */
  .post-title-row {
    padding-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .post-title {
    font-size: 22px;
    font-weight: 500;
    color: #000;
    line-height: 30px;
  }

  /* Контент-блок */
  .post-content {
    width: 592px;
    height: 342px;
    background: #fff;
    border-radius: 10px;
    border: 1px solid rgba(0,0,0,0.10);
    margin-bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #bbb;
    font-size: 14px;
  }

  .post-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Реакции */
  .reactions-bar {
    padding-top: 20px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .reaction {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    border-radius: 80px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 400;
    line-height: 22px;
    color: #595959;
  }

  .reaction-active {
    background: #0B5DD7;
    color: #fff;
  }

  .reaction-inactive {
    background: #F5F5F5;
  }
  .reaction-inactive:hover { background: #ebebeb; }

  .reaction-add {
    background: #F5F5F5;
    border-radius: 80px;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #595959;
  }
  .reaction-add:hover { background: #ebebeb; }

  /* Экшен-бар */
  .action-bar {
    padding: 12px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .action-left {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .action-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px 4px 0;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 56px;
    font-family: 'Roboto', sans-serif;
    font-size: 15px;
    color: #595959;
    line-height: 22px;
  }
  .action-btn:hover { background: #f4f4f4; }

  .action-icon-btn {
    width: 36px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 8px;
    padding: 4px 8px;
  }
  .action-icon-btn:hover { background: #f4f4f4; }

  .action-right {
    display: flex;
    align-items: center;
    gap: 4px;
    padding-left: 12px;
    color: #595959;
    font-size: 15px;
    line-height: 22px;
  }


  body {
    align-items: flex-start;
    gap: 16px;
  }

  .reaction-panel {
    width: 290px;
    flex: 0 0 290px;
    display: grid;
    grid-template-columns: repeat(5, 44px);
    grid-auto-rows: 44px;
    column-gap: 12.5px;
    row-gap: 12px;
    padding: 10px;
    background: #fff;
    border-radius: 14px;
  }

  .reaction-panel-item {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .reaction-panel-image {
    display: block;
    width: 36px;
    height: 36px;
    object-fit: contain;
  }

  @media (max-width: 1000px) {
    body {
      flex-direction: column;
      align-items: center;
      padding-top: 180px;
    }

    .view-switcher {
      top: 68px;
    }

    .theme-switcher {
      top: 120px;
    }

    .view-switcher,
    .theme-switcher {
      flex-direction: row;
    }
  }

  /* Адаптив */
  @media (max-width: 640px) {
    body { padding: 180px 0 0; }
    .site-header { padding: 0 16px; }
    .post-card { border-radius: 0; }
    .post-content {
      width: 100%;
      height: auto;
      min-height: 400px;
    }
  }

  /* Темная тема */

  /* Плавные переходы */
  body, .site-header, .site-logo, .view-switcher, .theme-switcher, .view-switch, .theme-switch, .post-card, .post-title, .author-name, .author-time, .author-section,
  .btn-subscribe, .reaction-inactive, .reaction-add, .action-btn, .action-right,
  .post-content, .reaction-panel {
    transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }

  /* Страница и карточка */
  [data-theme="dark"] body,
  [data-theme="dark"] .site-header,
  [data-theme="dark"] .view-switcher,
  [data-theme="dark"] .theme-switcher,
  [data-theme="dark"] .post-card,
  [data-theme="dark"] .reaction-panel { background: #000000; }
  [data-theme="dark"] .view-switcher,
  [data-theme="dark"] .theme-switcher { border-color: #2E2E2E; }
  [data-theme="dark"] .view-switch,
  [data-theme="dark"] .theme-switch { color: #969C9D; }
  [data-theme="dark"] .view-switch:hover,
  [data-theme="dark"] .theme-switch:hover { background: #333333; }
  [data-theme="dark"] .view-switch.is-active,
  [data-theme="dark"] .theme-switch.is-active { color: #FFFFFF; background: #418AF4; }
  [data-theme="dark"] .site-logo,
  [data-theme="dark"] .author-name,
  [data-theme="dark"] .author-section,
  [data-theme="dark"] .post-title { color: #FFFFFF; }
  [data-theme="dark"] .author-time { color: #969C9D; }
  [data-theme="dark"] .btn-subscribe { background: #333333; color: #FFFFFF; }
  [data-theme="dark"] .btn-subscribe:hover,
  [data-theme="dark"] .btn-more:hover { background: #2E2E2E; }
  [data-theme="dark"] .btn-more svg circle { fill: #FFFFFF; }
  [data-theme="dark"] .post-content { background: #000000; border-color: #2E2E2E; color: #969C9D; }
  [data-theme="dark"] .avatar-badge { border-color: #000000; }
  [data-theme="dark"] .reaction-pack-link { color: #969C9D; }
  [data-theme="dark"] .reaction-pack-link:hover { background: #333333; }
  [data-theme="dark"] .reaction-pack-link.is-active { color: #FFFFFF; background: #333333; }

  /* Реакции и экшен-бар */
  [data-theme="dark"] .reaction-active { background: #418AF4; color: #FFFFFF; }
  [data-theme="dark"] .reaction-inactive,
  [data-theme="dark"] .reaction-add { background: #333333; color: #969C9D; }
  [data-theme="dark"] .reaction-inactive:hover,
  [data-theme="dark"] .reaction-add:hover,
  [data-theme="dark"] .action-btn:hover,
  [data-theme="dark"] .action-icon-btn:hover { background: #2E2E2E; }
  [data-theme="dark"] .reaction-add svg path { stroke: #969C9D; }
  [data-theme="dark"] .action-btn { color: #FFFFFF; }
  [data-theme="dark"] .action-btn svg path,
  [data-theme="dark"] .action-icon-btn svg path { fill: #FFFFFF; }
  [data-theme="dark"] .action-right { color: #969C9D; }
  [data-theme="dark"] .action-right svg path { fill: #969C9D; }

  @media (prefers-reduced-motion: reduce) {
    body, .site-header, .site-logo, .view-switcher, .theme-switcher, .view-switch, .theme-switch, .post-card, .post-title, .author-name, .author-time, .author-section,
    .btn-subscribe, .reaction-inactive, .reaction-add, .action-btn, .action-right,
    .post-content, .reaction-panel {
      transition: none;
    }
  }
</style>
</head>
<body>

  <div class="site-logo" aria-label="Логотип">

  </div>
  <nav class="reaction-pack-switcher" aria-label="Набор реакций">
    <a class="reaction-pack-link is-active" href="#emodji" data-reaction-pack="emodji" aria-current="page">Emodji</a>
    <a class="reaction-pack-link" href="#cats" data-reaction-pack="cats">Коты</a>
  </nav>
</header>

<nav class="view-switcher" aria-label="Отображаемый раздел">
  <button class="view-switch is-active" type="button" data-view="post" aria-pressed="true">Пост</button>
  <button class="view-switch" type="button" data-view="reactions" aria-pressed="false">Реакции</button>
</nav>

<nav class="theme-switcher" aria-label="Цветовая тема">
  <button class="theme-switch is-active" type="button" data-theme-option="light" aria-pressed="true">Светлая</button>
  <button class="theme-switch" type="button" data-theme-option="dark" aria-pressed="false">Тёмная</button>

<div class="post-card">
  <div class="post-inner">

    <!-- Шапка -->
    <div class="post-header">
      <div class="author-block">
        <div class="avatar-wrap">
          <div class="avatar-main"></div>
          <div class="avatar-badge"></div>
        </div>
        <div class="author-info">
          <div class="author-name-row">
            <div class="author-name">Название проекта</div>
            <div class="author-name-badge">
              <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

    <!-- Заголовок -->

    <!-- Контент-блок: сюда вставляется содержимое карточки -->

    <!-- Реакции -->

    <!-- Экшен-бар -->
    <div class="action-bar">
      <div class="action-left">

  }));
  const reactionPacks = { emodji: webpReactions, cats: catReactions };

  function createReactionImage(reaction, className, isPaused = false) {
    const image = document.createElement('img');
    image.className = className;
    image.dataset.animationSrc = reaction.src;
    if (!isPaused) image.src = reaction.src;
    image.alt = '';
    image.draggable = false;
    return image;
  }

  function mountReactions(packName) {
    const reactionsBar = document.querySelector('.reactions-bar');
    const addReactionButton = document.querySelector('.reaction-add');
    const reactionPanel = document.getElementById('reaction-panel');
    const reactions = reactionPacks[packName];

    reactionsBar.querySelectorAll('.reaction-inactive').forEach((item) => item.remove());
    reactionPanel.replaceChildren();

    reactions.forEach((reaction) => {
      const barItem = document.createElement('div');
      barItem.className = 'reaction reaction-inactive';
      barItem.title = reaction.name;
      barItem.setAttribute('aria-label', `${reaction.name}: ${reaction.count}`);

      const icon = document.createElement('span');
      icon.className = 'reaction-icon';
      icon.appendChild(createReactionImage(reaction, 'reaction-webp-image'));

      const count = document.createElement('span');
      count.textContent = reaction.count;
      barItem.append(icon, count);
      reactionsBar.insertBefore(barItem, addReactionButton);
    });

    const panelReactions = packName === 'emodji'
      ? panelReactionNames.map((name) => reactions.find((reaction) => reaction.name === name))
      : reactions;
    panelReactions.forEach((reaction) => {
      const panelItem = document.createElement('div');
      panelItem.className = 'reaction-panel-item';
      panelItem.title = reaction.name;
      panelItem.appendChild(createReactionImage(reaction, 'reaction-panel-image', reactionPanel.hidden));
      reactionPanel.appendChild(panelItem);
    });
  }

  mountReactions('emodji');

  const reactionPackLinks = document.querySelectorAll('.reaction-pack-link');

  function setReactionPack(packName) {
    mountReactions(packName);
    reactionPackLinks.forEach((link) => {
      const isActive = link.dataset.reactionPack === packName;
      link.classList.toggle('is-active', isActive);
      link.toggleAttribute('aria-current', isActive);
    });
  }

  reactionPackLinks.forEach((link) => {
    link.addEventListener('click', (event) => {
      event.preventDefault();
      const packName = link.dataset.reactionPack;
      if (link.classList.contains('is-active')) return;
      setReactionPack(packName);
    });
  });

  const postCard = document.querySelector('.post-card');
  const reactionPanel = document.getElementById('reaction-panel');
  const viewSwitchButtons = document.querySelectorAll('.view-switch');

  function pauseImages(container) {
    container.querySelectorAll('img[src]').forEach((image) => {
      if (!image.dataset.animationSrc) image.dataset.animationSrc = image.getAttribute('src');
      image.removeAttribute('src');
    });
  }

  function resumeImages(container) {
    container.querySelectorAll('img[data-animation-src]:not([src])').forEach((image) => {
      image.src = image.dataset.animationSrc;
    });
  }

  function setActiveView(view) {
    const showPost = view === 'post';
    const visibleView = showPost ? postCard : reactionPanel;
    const hiddenView = showPost ? reactionPanel : postCard;

    pauseImages(hiddenView);
    hiddenView.hidden = true;
    visibleView.hidden = false;
    resumeImages(visibleView);

    viewSwitchButtons.forEach((button) => {
      const isActive = button.dataset.view === view;
      button.classList.toggle('is-active', isActive);
      button.setAttribute('aria-pressed', String(isActive));
    });
  }

  viewSwitchButtons.forEach((button) => {
    button.addEventListener('click', () => {
      if (button.getAttribute('aria-pressed') === 'true') return;
      setActiveView(button.dataset.view);
    });
  });

  const badgeUploadMessage = 'Перетащите картинку в формате SVG, PNG, JPG, JPEG, WEBP или GIF.';
  const supportedBadgeExtensions = ['svg', 'png', 'jpg', 'jpeg', 'webp', 'gif'];

  // Переключение темы
  const themeSwitchButtons = document.querySelectorAll('.theme-switch');

  function setTheme(theme) {
    const html = document.documentElement;

    if (theme === 'dark') {
      html.setAttribute('data-theme', 'dark');
    } else {
      html.removeAttribute('data-theme');
    }

    themeSwitchButtons.forEach((button) => {
      const isActive = button.dataset.themeOption === theme;
      button.classList.toggle('is-active', isActive);
      button.setAttribute('aria-pressed', String(isActive));
    });
  }

  themeSwitchButtons.forEach((button) => {
    button.addEventListener('click', () => {
      if (button.getAttribute('aria-pressed') === 'true') return;
      setTheme(button.dataset.themeOption);
    });
  });

  function isSupportedBadgeImage(file) {
    const extension = file.name.split('.').pop().toLowerCase();
    return file.type.startsWith('image/') || supportedBadgeExtensions.includes(extension);
  }

  function showBadgeUploadAlert() {
    alert(badgeUploadMessage);
  }

  function replaceImageContent(container, src, className) {
    container.innerHTML = '';

    const image = document.createElement('img');
    image.className = className;
    image.alt = '';

    if (container.closest('[hidden]')) {
      image.dataset.animationSrc = src;
    } else {
      image.src = src;
    }

    container.appendChild(image);
  }

  document.addEventListener('dragover', (event) => {
    event.preventDefault();
  });

  document.addEventListener('drop', (event) => {
    event.preventDefault();

    const file = event.dataTransfer.files[0];
    if (!file || !isSupportedBadgeImage(file)) {
      showBadgeUploadAlert();
      return;
    }

    const reader = new FileReader();

    reader.addEventListener('load', () => {
      const badge = document.querySelector('.author-name-badge');
      replaceImageContent(badge, reader.result, 'author-name-badge-image');
    });

    reader.addEventListener('error', showBadgeUploadAlert);
    reader.readAsDataURL(file);
  });
